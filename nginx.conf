server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Les interventions d'une fenêtre de 13 mois représentent plusieurs
    # méga-octets de JSON : la compression n'est pas optionnelle.
    gzip on;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml;
    gzip_min_length 1024;
    gzip_proxied any;

    # Résolveur interne de Docker. Sans lui, nginx fige l'adresse de l'API au
    # démarrage et sert du 502 dès que le conteneur API est reconstruit avec
    # une nouvelle IP. Passer par une variable force la résolution à chaque
    # requête ; comme `$api` ne porte pas de chemin, l'URI d'origine est
    # transmise telle quelle.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $api http://pilotage-api:3100;
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Un import porte plusieurs milliers de lignes.
        client_max_body_size 64m;
        proxy_read_timeout 300s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
